<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GRX | SECURE_HQ</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Rajdhani:wght@500;700&family=Space+Mono&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gowrax: {
                            void: '#1A1C2E', abyss: '#0D0E15', purple: '#6F2DBD', neon: '#D62F7F',
                            lavender: '#B185DB', quartz: '#F7CAD0', ether: '#A2D2FF',
                            starlight: '#F0F2F5', gold: '#E9C46A'
                        }
                    },
                    fontFamily: {
                        rajdhani: ['Rajdhani', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                        techMono: ['Space Mono', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            background-color: #0D0E15; color: #F0F2F5; font-family: 'Poppins', sans-serif; overflow: hidden; 
            -webkit-tap-highlight-color: transparent;
        }

        /* =========================================
           BACKGROUND: SEA REFLECTIONS & TACTICAL GRID
           ========================================= */
        .sea-reflections { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .sea-reflections::after {
            content: ''; position: absolute; inset: 0; opacity: 0.04; z-index: 5;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        .tactical-grid {
            position: absolute; inset: 0; z-index: 1; opacity: 0.15;
            background-image: 
                linear-gradient(rgba(162, 210, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(162, 210, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .wave { position: absolute; filter: blur(100px); border-radius: 50%; opacity: 0.15; animation: waveFloat 10s infinite alternate ease-in-out; }
        .wave-quartz { background: #F7CAD0; width: 80vw; height: 30vh; top: -10%; left: -10%; }
        .wave-ether { background: #A2D2FF; width: 60vw; height: 30vh; bottom: -10%; right: -10%; animation-delay: -5s; }
        @keyframes waveFloat { 0% { transform: translateY(0px) scaleX(1); opacity: 0.1; } 100% { transform: translateY(30px) scaleX(1.1); opacity: 0.2; } }

        /* =========================================
           GLASSMORPHISM & INPUTS
           ========================================= */
        .glass-panel {
            background: rgba(13, 14, 21, 0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .admin-input {
            background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px; width: 100%; color: white; outline: none; border-radius: 12px;
            font-family: 'Space Mono', monospace; font-size: 0.85rem; transition: all 0.3s ease;
        }
        .admin-input:focus { border-color: #A2D2FF; background: rgba(162, 210, 255, 0.05); box-shadow: 0 0 20px rgba(162, 210, 255, 0.1); }
        .admin-input::placeholder { color: rgba(255, 255, 255, 0.2); }

        .btn-pub {
            background: linear-gradient(135deg, rgba(162,210,255,0.15) 0%, rgba(177,133,219,0.15) 100%);
            border: 1px solid rgba(162, 210, 255, 0.3); border-radius: 12px;
            color: white; padding: 14px; font-family: 'Space Mono', monospace; font-weight: bold;
            transition: all 0.3s; cursor: pointer; text-transform: uppercase; letter-spacing: 2px;
        }
        .btn-pub:hover { border-color: #A2D2FF; background: rgba(162,210,255,0.25); box-shadow: 0 0 20px rgba(162, 210, 255, 0.2); transform: translateY(-2px); }

        /* =========================================
           DASHBOARD NAVIGATION (CORE.JS REQUIRED)
           ========================================= */
        .nav-link { 
            border-left: 2px solid transparent; transition: all 0.3s; cursor: pointer; 
            border-radius: 0 12px 12px 0; margin-bottom: 4px;
        }
        .nav-link:hover { background: rgba(255, 255, 255, 0.03); }
        .nav-link.active { 
            border-left: 2px solid #A2D2FF; color: #A2D2FF; 
            background: linear-gradient(90deg, rgba(162,210,255,0.1) 0%, transparent 100%); 
        }
        
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeInZen 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeInZen { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Custom Scrollbar for Main Content */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(162, 210, 255, 0.2); border-radius: 10px; }
    </style>
</head>
<body class="flex min-h-screen">

    <div class="sea-reflections">
        <div class="tactical-grid"></div>
        <div class="wave wave-quartz"></div>
        <div class="wave wave-ether"></div>
    </div>

    <div id="login-zone" class="fixed inset-0 z-[100] flex flex-col items-center justify-center p-6 backdrop-blur-sm">
        
        <a href="https://gowrax.me" class="absolute top-8 left-8 flex items-center gap-2 text-gray-500 hover:text-gowrax-ether transition-colors font-techMono text-xs uppercase tracking-widest group">
            <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Retour_Portail_Public
        </a>

        <div class="glass-panel max-w-md w-full p-10 rounded-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-gowrax-ether to-gowrax-lavender animate-pulse shadow-[0_0_15px_#A2D2FF]"></div>
            
            <div class="text-center mb-10">
                <div class="w-16 h-16 mx-auto bg-white/5 border border-white/10 rounded-2xl flex items-center justify-center mb-4 shadow-inner">
                    <svg class="w-8 h-8 text-gowrax-ether" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
                </div>
                <h1 class="text-white text-3xl mb-1 tracking-tighter uppercase font-bold font-rajdhani">HQ_GATEWAY</h1>
                <p class="text-[9px] text-gowrax-ether uppercase tracking-[0.3em]">Accès Restreint // Niveau_01</p>
            </div>
            
            <div class="space-y-4">
                <input type="email" id="email" placeholder="ADMIN_EMAIL" class="admin-input">
                <input type="password" id="password" placeholder="PASSWORD" class="admin-input">
            </div>
            
            <button id="login-button" class="btn-pub w-full mt-8 flex items-center justify-center gap-3 group">
                INITIALISER_LIAISON
                <svg class="w-4 h-4 text-white/50 group-hover:text-white transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            </button>
            
            <div id="login-error" class="text-red-400 bg-red-500/10 border border-red-500/20 p-3 rounded-xl text-[10px] mt-6 text-center hidden font-techMono uppercase tracking-widest">
                [ Erreur ] Identifiants corrompus ou accès refusé.
            </div>
        </div>
    </div>

    <div id="app-root" class="flex w-full h-screen hidden"></div>

    <template id="dashboard-template">
        <div class="flex w-full h-screen relative">
            
            <div id="mobile-overlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden md:hidden opacity-0 transition-opacity duration-300"></div>

            <aside id="hq-sidebar" class="w-72 fixed md:relative inset-y-0 left-0 z-50 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out glass-panel border-r border-white/5 flex flex-col h-full bg-[#0D0E15]/90">
                
                <div class="p-8 pb-4">
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-white text-3xl font-bold tracking-tighter font-rajdhani flex items-center gap-2">
                            GRX<span class="text-gowrax-ether">_</span>HQ
                        </h2>
                        <button onclick="toggleMobileMenu()" class="md:hidden text-gray-400 hover:text-white">
                            <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                        </button>
                    </div>
                    <div class="flex items-center gap-2 bg-green-500/10 border border-green-500/20 w-fit px-2 py-1 rounded-md">
                        <span class="w-1.5 h-1.5 bg-green-500 rounded-full animate-pulse"></span>
                        <span class="text-[9px] text-green-400 font-techMono uppercase tracking-widest">Liaison Sécurisée</span>
                    </div>
                </div>

                <nav class="flex-1 overflow-y-auto custom-scrollbar p-4 pr-0 space-y-1 mt-6">
                    <p class="px-4 font-techMono text-[8px] text-gray-600 uppercase tracking-[0.2em] mb-4">/ Bases_de_Données</p>
                    
                    <div onclick="window.Core.switchView('view-broadcast'); toggleMobileMenuIfOpen();" class="nav-link p-3.5 text-[11px] font-techMono uppercase tracking-widest text-gray-300" id="link-broadcast">
                        <svg class="w-4 h-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                        Broadcast
                    </div>
                    <div onclick="window.Core.switchView('view-news'); toggleMobileMenuIfOpen();" class="nav-link p-3.5 text-[11px] font-techMono uppercase tracking-widest active" id="link-news">
                        <svg class="w-4 h-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/></svg>
                        News & Intel
                    </div>
                    
                    <p class="px-4 font-techMono text-[8px] text-gray-600 uppercase tracking-[0.2em] mb-4 mt-8">/ Réseaux_Externes</p>
                    

                    <div onclick="window.Core.switchView('view-partners'); toggleMobileMenuIfOpen();" class="nav-link p-3.5 text-[11px] font-techMono uppercase tracking-widest text-gowrax-gold" id="link-partners">
                        <svg class="w-4 h-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        Partenariats
                    </div>
                    <div onclick="window.Core.switchView('view-storage'); toggleMobileMenuIfOpen();" class="nav-link p-3.5 text-[11px] font-techMono uppercase tracking-widest text-teal-400" id="link-storage">
                        <svg class="w-4 h-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>
                        Cloud Vault
                    </div>
                </nav>

                <div class="p-6 border-t border-white/5 flex flex-col gap-4">
                    <a href="https://gowrax.me" class="flex items-center gap-2 font-techMono text-[10px] text-gray-400 hover:text-white uppercase tracking-widest transition-colors">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0-3-4.03-3-9s1.343-9 3-9m-9 9a9 9 0 019-9"/></svg>
                        Retour Portail
                    </a>
                    <button onclick="window.Core.logout()" class="flex items-center gap-2 font-techMono text-[10px] text-red-500 hover:text-red-400 bg-red-500/10 hover:bg-red-500/20 px-3 py-2 rounded-lg uppercase tracking-widest transition-colors text-left w-full">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                        Rompre la liaison
                    </button>
                </div>
            </aside>

            <div class="flex-1 flex flex-col h-screen relative overflow-hidden">
                
                <header class="md:hidden glass-panel border-b border-white/5 p-4 flex items-center justify-between z-30 sticky top-0">
                    <div class="flex items-center gap-3">
                        <button onclick="toggleMobileMenu()" class="text-white bg-white/5 border border-white/10 p-2 rounded-lg hover:bg-white/10">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                        </button>
                        <span class="font-rajdhani text-xl font-bold uppercase">HQ_ACCESS</span>
                    </div>
                    <div class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
                </header>

                <main id="main-panel" class="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-12 relative z-10 w-full">
                    </main>
            </div>
            
        </div>
    </template>

    <script>
        // Logique pour le menu Mobile (Tiroir)
        function toggleMobileMenu() {
            const sidebar = document.getElementById('hq-sidebar');
            const overlay = document.getElementById('mobile-overlay');
            
            if (sidebar.classList.contains('-translate-x-full')) {
                // Ouvrir
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                // Fermer
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function toggleMobileMenuIfOpen() {
            // Ferme le menu sur mobile quand on clique sur un lien
            if (window.innerWidth < 768) {
                toggleMobileMenu();
            }
        }
    </script>

    <script type="module" src="./js/core.js"></script>
</body>
</html>
